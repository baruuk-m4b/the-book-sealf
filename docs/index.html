<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2f5d50">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Rownini Reads</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth" hidden>
    <div class="auth-card">
      <h1>Rownini Reads</h1>
      <p>Your ebooks and manga, synced between laptop and phone.</p>
      <button id="googleBtn" class="btn primary">Continue with Google</button>
      <div class="or">or use email</div>
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
      <div class="row">
        <button id="signInBtn" class="btn">Sign in</button>
        <button id="signUpBtn" class="btn">Create account</button>
      </div>
      <p id="authErr" class="err"></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="bar">
        <h1 id="title">Currently reading</h1>
        <span id="sync" class="sync" title="Sync status"></span>
        <button id="menuBtn" class="icon-btn" aria-label="Backup and account">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
      </div>
      <form id="sform"><input id="q" type="search" placeholder="Search your  or find a new book" enterkeyhint="search" autocomplete="off"></form>
    </header>

    <main id="view"></main>

    <nav class="tabs" id="tabs">
      <button data-tab="reading"><svg viewBox="0 0 24 24"><path d="M3 5.5c3-1.2 6-1 9 1 3-2 6-2.2 9-1v13c-3-1.2-6-1-9 1-3-2-6-2.2-9-1z"/><path d="M12 6.5v13"/></svg><span>Reading</span></button>
      <button data-tab="kobo"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M10 18h4"/></svg><span>In Kobo</span></button>
      <button data-tab="library"><svg viewBox="0 0 24 24"><path d="M5 3v18M10 3v18M15 5l4 16"/></svg><span>Library</span></button>
      <button data-tab="queue"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Queue</span></button>
      <button data-tab="interested"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg><span>Interested</span></button>
    </nav>
  </div>

  <div id="scrim" hidden></div>
  <section id="sheet" hidden role="dialog" aria-modal="true"></section>
  <div id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
